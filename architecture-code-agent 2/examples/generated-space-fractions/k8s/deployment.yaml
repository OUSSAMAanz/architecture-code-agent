apiVersion: apps/v1
kind: Deployment
metadata:
  name: space-fractions
spec:
  replicas: 3
  selector:
    matchLabels: {app: space-fractions}
  template:
    metadata:
      labels: {app: space-fractions}
    spec:
      containers:
        - name: app
          image: space-fractions:latest
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet: {path: /health, port: 3000}
